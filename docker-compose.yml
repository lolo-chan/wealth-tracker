services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wealthtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/wealthtracker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    build: ./wealth-tracker-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production

volumes:
  postgres_data: